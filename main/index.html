<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>PARTÍCULAS COM AS MÃOS</title>

    <!-- MEDIAPIPE -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
      }

      canvas {
        display: block;
      }

      video {
        position: absolute;
        width: 240px;
        right: 20px;
        bottom: 20px;
        border-radius: 20px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        transform: scaleX(-1);
        z-index: 10;
      }

      #handCanvas {
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
      }

      .hud {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 20;
        color: white;
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(20px);
        border-radius: 20px;
        padding: 20px;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .hud h1 {
        font-size: 28px;
        margin-bottom: 15px;
      }

      .line {
        margin-top: 8px;
        opacity: 0.9;
      }
    </style>
  </head>

  <body>
    <video id="video" autoplay muted playsinline></video>

    <canvas id="handCanvas"></canvas>

    <script type="module">
      const explosionSound = new Audio("./sounds/explosion.mp3");

      const chargeSound = new Audio("./sounds/charge.mp3");

      const ambientSound = new Audio("./sounds/ambient.mp3");
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js";

      // =====================================================
      // VIDEO
      // =====================================================
      // =====================================================
      // AUDIO
      // =====================================================
      window.addEventListener(
        "click",
        async () => {
          await audioContext.resume();

          audio.play();
        },
        { once: true },
      );

      const audio = new Audio("interestrela.mp3");

      audio.loop = true;

      const audioContext = new AudioContext();

      const source = audioContext.createMediaElementSource(audio);

      const analyser = audioContext.createAnalyser();

      source.connect(analyser);

      analyser.connect(audioContext.destination);

      analyser.fftSize = 256;

      const bufferLength = analyser.frequencyBinCount;

      const dataArray = new Uint8Array(bufferLength);

      const video = document.getElementById("video");

      navigator.mediaDevices
        .getUserMedia({
          video: true,
        })
        .then((stream) => {
          video.srcObject = stream;
        });

      // =====================================================
      // SCENE
      // =====================================================

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x000000, 0.0007);

      // =====================================================
      // CAMERA
      // =====================================================

      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        5000,
      );

      camera.position.z = 700;

      // =====================================================
      // RENDERER
      // =====================================================

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
      });

      renderer.setSize(window.innerWidth, window.innerHeight);

      renderer.setPixelRatio(window.devicePixelRatio);

      document.body.appendChild(renderer.domElement);

      // =====================================================
      // PARTICLES
      // =====================================================

      const PARTICLE_COUNT = 25000;

      const positions = new Float32Array(PARTICLE_COUNT * 3);

      const colors = new Float32Array(PARTICLE_COUNT * 3);

      const velocities = [];

      const originalPositions = [];

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const x = (Math.random() - 0.5) * 2500;

        const y = (Math.random() - 0.5) * 2500;

        const z = (Math.random() - 0.5) * 1200;

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        originalPositions.push({
          x,
          y,
          z,
        });

        velocities.push({
          x: 0,
          y: 0,
          z: 0,
        });

        const random = Math.random();

        if (random > 0.8) {
          colors[i * 3] = 1;
          colors[i * 3 + 1] = 1;
          colors[i * 3 + 2] = 1;
        } else if (random > 0.5) {
          colors[i * 3] = 1;
          colors[i * 3 + 1] = 1;
          colors[i * 3 + 2] = 1;
        } else {
          colors[i * 3] = 1;
          colors[i * 3 + 1] = 1;
          colors[i * 3 + 2] = 1;
        }
      }

      const geometry = new THREE.BufferGeometry();

      geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(positions, 3),
      );

      geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 1.5,
        vertexColors: true,
        transparent: true,
        opacity: 1,
        blending: THREE.AdditiveBlending,
        alphaTest: 0.001,
        depthWrite: false,
      });

      const particles = new THREE.Points(geometry, material);

      scene.add(particles);
      // =====================================================
      // LIGHT
      // =====================================================

      const light = new THREE.PointLight(0x00ffff, 2, 3000);

      light.position.set(0, 0, 500);

      scene.add(light);

      // =====================================================
      // HAND TRACKING CANVAS
      // =====================================================

      const handCanvas = document.getElementById("handCanvas");

      const handCtx = handCanvas.getContext("2d");

      handCanvas.width = window.innerWidth;

      handCanvas.height = window.innerHeight;

      // =====================================================
      // MEDIAPIPE
      // =====================================================

      const hands = new Hands({
        locateFile: (file) => {
          return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        },
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7,
      });

      // =====================================================
      // HANDS
      // =====================================================

      const handPoints = [];

      let handsJoined = false;

      let explosionForce = 0;

      // =====================================================
      // FUNÇÃO DISTÂNCIA
      // =====================================================

      function handDistance(hand1, hand2) {
        const p1 = hand1[9];

        const p2 = hand2[9];

        const dx = p1.x - p2.x;

        const dy = p1.y - p2.y;

        return Math.sqrt(dx * dx + dy * dy);
      }
      // =====================================================
      // SISTEMA Naja Cobra
      // =====================================================

      // OBJETIVO:
      //
      // ☝️ levantar APENAS o dedo indicador
      //
      // As partículas:
      //
      // - se juntam
      // - formam uma cobra naja 3D
      // - ficam animadas
      // - movimento orgânico
      //
      // =====================================================

      // ATIVAR

      let najaMode = false;

      // SHAPE

      const najaTargets = [];

      // =====================================================
      // DETECTAR INDICADOR
      // =====================================================

      function detectNajaGesture(hand) {
        const indexUp = hand[8].y < hand[6].y;

        const middleDown = hand[12].y > hand[10].y;

        const ringDown = hand[16].y > hand[14].y;

        const pinkyDown = hand[20].y > hand[18].y;

        return indexUp && middleDown && ringDown && pinkyDown;
      }

      // =====================================================
      // CRIAR COBRA NAJA
      // =====================================================

      function createNajaShape() {
        najaTargets.length = 0;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
          // PROGRESSO

          const t = i / PARTICLE_COUNT;

          // CORPO

          const angle = t * Math.PI * 10;

          const radius = 20 + Math.sin(t * 8) * 10;

          const x = Math.sin(angle) * radius;

          const y = (t - 0.5) * 700;

          const z = Math.cos(angle) * radius;

          // CAPUZ DA NAJA

          let hoodX = x;

          if (t > 0.75) {
            hoodX += Math.sin(angle) * 120 * (t - 0.75);
          }

          najaTargets.push({
            x: hoodX,
            y,
            z,
          });
        }
      }
      // =====================================================
      // BURACO NEGRO
      // =====================================================

      let blackHoleMode = false;

      function detectClosedFist(hand) {
        const fingersDown =
          hand[8].y > hand[6].y &&
          hand[12].y > hand[10].y &&
          hand[16].y > hand[14].y &&
          hand[20].y > hand[18].y;

        return fingersDown;
      }
      // =====================================================
      // FORMAS ESPECIAIS
      // =====================================================

      let sphereMode = false;

      let tornadoMode = false;

      let galaxyMode = false;

      const sphereTargets = [];

      const tornadoTargets = [];

      const galaxyTargets = [];

      // =====================================================
      // GESTOS
      // =====================================================

      // ✌️ DOIS DEDOS = ESFERA

      function detectSphereGesture(hand) {
        const indexUp = hand[8].y < hand[6].y;

        const middleUp = hand[12].y < hand[10].y;

        const ringDown = hand[16].y > hand[14].y;

        const pinkyDown = hand[20].y > hand[18].y;

        return indexUp && middleUp && ringDown && pinkyDown;
      }

      // 🤘 = TORNADO

      function detectTornadoGesture(hand) {
        const indexUp = hand[8].y < hand[6].y;

        const pinkyUp = hand[20].y < hand[18].y;

        const middleDown = hand[12].y > hand[10].y;

        const ringDown = hand[16].y > hand[14].y;

        return indexUp && pinkyUp && middleDown && ringDown;
      }

      // =====================================================
      // 🖕 DEDO MINDINHO = GALÁXIA
      // =====================================================

      function detectGalaxyGesture(hand) {
        const pinkyUp = hand[20].y < hand[18].y;

        const indexDown = hand[8].y > hand[6].y;

        const middleDown = hand[12].y > hand[10].y;

        const ringDown = hand[16].y > hand[14].y;

        return pinkyUp && indexDown && middleDown && ringDown;
      }

      // =====================================================
      // ESFERA
      // =====================================================

      function createSphereShape() {
        sphereTargets.length = 0;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);

          const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;

          const radius = 300;

          sphereTargets.push({
            x: radius * Math.cos(theta) * Math.sin(phi),
            y: radius * Math.sin(theta) * Math.sin(phi),
            z: radius * Math.cos(phi),
          });
        }
      }

      // =====================================================
      // TORNADO
      // =====================================================

      function createTornadoShape() {
        tornadoTargets.length = 0;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const t = i / PARTICLE_COUNT;

          const angle = t * 60;

          const radius = t * 250;

          tornadoTargets.push({
            x: Math.cos(angle) * radius,
            y: (t - 0.5) * 1200,
            z: Math.sin(angle) * radius,
          });
        }
      }

      // =====================================================
      // GALÁXIA
      // =====================================================

      function createGalaxyShape() {
        galaxyTargets.length = 0;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const angle = i * 0.15;

          const radius = Math.sqrt(i) * 6;

          galaxyTargets.push({
            x: Math.cos(angle) * radius,
            y: (Math.random() - 0.5) * 60,
            z: Math.sin(angle) * radius,
          });
        }
      }
      // =====================================================
      // SHAPE MODE
      // =====================================================

      let currentShape = "none";
      let lastShape = "none";
      // =====================================================
      // SONS DOS PODERES
      // =====================================================

      const najaAudio = new Audio("naja.mp3");
      najaAudio.playbackRate = 0.8;
      const sphereAudio = new Audio("sphere.mp3");
      sphereAudio.playbackRate = 1.1;

      const tornadoAudio = new Audio("tornado.mp3");
      tornadoAudio.playbackRate = 0.9;

      const galaxyAudio = new Audio("galaxy.mp3");
      galaxyAudio.playbackRate = 1.2;

      const blackHoleAudio = new Audio("blackhole.mp3");
      blackHoleAudio.playbackRate = 0.6;
      const background = new Audio("background.mp3");
      background.playbackRate = 0.6;

      background.loop = true;

      background.volume = 0.7;

      background.playbackRate = 0.6;
      // VOLUME

      najaAudio.volume = 0.7;

      sphereAudio.volume = 0.7;

      tornadoAudio.volume = 0.7;

      galaxyAudio.volume = 0.7;

      background.volume = 0.7;

      // CONTROLE


      // TOCAR SOM
      function stopAllSounds() {
        najaAudio.pause();
        sphereAudio.pause();
        tornadoAudio.pause();
        galaxyAudio.pause();
        blackHoleAudio.pause();

        najaAudio.currentTime = 0;
        sphereAudio.currentTime = 0;
        tornadoAudio.currentTime = 0;
        galaxyAudio.currentTime = 0;
        blackHoleAudio.currentTime = 0;
      }
      function playShapeSound(shape) {
        if (lastShape === shape) return;

        lastShape = shape;

        stopAllSounds();

        if (shape === "naja") {
          najaAudio.play();
        } else if (shape === "sphere") {
          sphereAudio.play();
        } else if (shape === "tornado") {
          tornadoAudio.play();
        } else if (shape === "galaxy") {
          galaxyAudio.play();
        } else if (shape === "blackhole") {
          blackHoleAudio.play();
        }
      }
      hands.onResults((results) => {
        // =====================================================
        // JUNTAR / EXPLODIR PARTÍCULAS
        // =====================================================

        if (
          results.multiHandLandmarks &&
          results.multiHandLandmarks.length === 2
        ) {
          const hand1 = results.multiHandLandmarks[0];

          const hand2 = results.multiHandLandmarks[1];

          const dist = handDistance(hand1, hand2);

          // MÃOS JUNTAS

          if (dist < 0.18) {
            handsJoined = true;
          }

          // ABRIR MÃOS = EXPLOSÃO

          if (handsJoined && dist > 0.28) {
            handsJoined = false;

            explosionForce = 1;
          }
        }
        handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);

        handPoints.length = 0;

        if (results.multiHandLandmarks) {
          for (const hand of results.multiHandLandmarks) {
            // =====================================================
            // ATIVAR NAJA
            // =====================================================
            // =====================================================
            // SHAPE DETECTION
            // =====================================================

            currentShape = "none";

            // COBRA

            if (detectNajaGesture(hand)) {
              playShapeSound("naja");
              currentShape = "naja";

              createNajaShape();
            }

            // ESFERA
            else if (detectSphereGesture(hand)) {
              playShapeSound("sphere");
              currentShape = "sphere";

              createSphereShape();
            }

            // TORNADO
            else if (detectTornadoGesture(hand)) {
              playShapeSound("tornado");
              currentShape = "tornado";

              createTornadoShape();
            }

            // GALÁXIA
            else if (detectGalaxyGesture(hand)) {
              playShapeSound("galaxy");
              currentShape = "galaxy";

              createGalaxyShape();
            }
            // =====================================================
            // DETECTAR BURACO NEGRO
            // =====================================================

            // =====================================================
            // MÃO FECHADA = BURACO NEGRO + SOM
            // =====================================================

            if (detectClosedFist(hand)) {
              currentShape = "blackhole";

              if (!blackHoleMode) {
                blackHoleMode = true;

                playShapeSound("blackhole");
              }
            } else {
              blackHoleMode = false;
              
            }
            if (detectNajaGesture(hand)) {
              if (!najaMode) {
                createNajaShape();
              }

              najaMode = true;
            } else {
              najaMode = false;


              for (const point of hand) {
                handPoints.push({
                  x: (point.x - 0.5) * 2500,

                  y: -(point.y - 0.5) * 2500,
                });
              }
            }
          }
        }
      });

      // =====================================================
      // START CAMERA
      // =====================================================

      const mediapipeCamera = new Camera(video, {
        onFrame: async () => {
          await hands.send({
            image: video,
          });
        },

        width: 640,
        height: 480,
      });

      mediapipeCamera.start();

      // =====================================================
      // ANIMATION
      // =====================================================

      function animate() {
        requestAnimationFrame(animate);
        const pos = geometry.attributes.position.array;
        analyser.getByteFrequencyData(dataArray);

        // =====================================================
        // ENERGIA TOTAL DO ÁUDIO
        // =====================================================

        let audioEnergy = 0;

        for (let i = 0; i < bufferLength; i++) {
          audioEnergy += dataArray[i];
        }

        audioEnergy /= bufferLength;
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const audioForce = audioEnergy * 0.0015;
          const ix = i * 3;

          let px = pos[ix];
          let py = pos[ix + 1];
          let pz = pos[ix + 2];

          const velocity = velocities[i];
          // =====================================================
          // PRESSÃO SONORA
          // =====================================================

          const time = Date.now() * 0.002;

          const pressure = audioEnergy * 0.003;

          // DISTÂNCIA DO CENTRO

          const dist = Math.sqrt(px * px + py * py);

          // ONDA SONORA

          const soundWave = Math.sin(dist * 0.02 - time * 8);

          // FORÇA DA PRESSÃO

          const force = soundWave * pressure;

          // DIREÇÃO

          const angle = Math.atan2(py, px);

          // EMPURRAR PARTÍCULAS

          velocity.x += Math.cos(angle) * force;

          velocity.y += Math.sin(angle) * force;

          // PROFUNDIDADE

          velocity.z += soundWave * pressure * 10;
          // =====================================================
          // MORPH NAJA ESTÁTICA
          // =====================================================

          // =====================================================
          // SHAPE MORPH
          // =====================================================

          let target = null;

          if (currentShape === "naja") {
            target = najaTargets[i];
          } else if (currentShape === "sphere") {
            target = sphereTargets[i];
          } else if (currentShape === "tornado") {
            target = tornadoTargets[i];
          } else if (currentShape === "galaxy") {
            target = galaxyTargets[i];
          }

          if (target) {
            px += (target.x - px) * 0.08;

            py += (target.y - py) * 0.08;

            pz += (target.z - pz) * 0.08;

            velocity.x *= 0.9;

            velocity.y *= 0.9;

            velocity.z *= 0.9;
          }
          // =====================================================
          // MORPH NAJA
          // =====================================================

          if (najaMode && najaTargets[i]) {
            const target = najaTargets[i];

            // FORÇA

            velocity.x += (target.x - px) * 0.015;

            velocity.y += (target.y - py) * 0.015;

            velocity.z += (target.z - pz) * 0.015;

            // MOVIMENTO ORGÂNICO
          }
          const noise = Math.sin(i + Date.now() * 0.001) * 0.02;

          velocity.x += noise;

          velocity.y += noise;

          if (explosionForce > 0) {
            // DIREÇÃO ALEATÓRIA

            const randomX = Math.random() - 0.5;

            const randomY = Math.random() - 0.5;

            const randomZ = Math.random() - 0.5;

            // NORMALIZAÇÃO

            const length = Math.sqrt(
              randomX * randomX + randomY * randomY + randomZ * randomZ,
            );

            const dirX = randomX / length;

            const dirY = randomY / length;

            const dirZ = randomZ / length;

            // FORÇA

            const power = explosionForce * 12;

            // EXPLOSÃO

            velocity.x += dirX * power;

            velocity.y += dirY * power;

            velocity.z += dirZ * power;
          }

          // =========================================
          // HAND FORCE
          // =========================================

          for (const hand of handPoints) {
            const dx = px - hand.x;

            const dy = py - hand.y;

            const dist = Math.sqrt(dx * dx + dy * dy);

            // ÁREA MENOR DE IMPACTO

            if (dist < 90) {
              // FORÇA MAIS SUAVE

              const force = (90 - dist) * 0.04;

              const angle = Math.atan2(dy, dx);

              velocity.x += Math.cos(angle) * force;

              velocity.y += Math.sin(angle) * force;
            }
          }
          // =====================================================
          // BURACO NEGRO
          // =====================================================

          if (blackHoleMode && handPoints[0]) {
            const hx = handPoints[0].x;
            const hy = handPoints[0].y;

            const dx = hx - px;
            const dy = hy - py;

            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 500) {
              const force = (500 - dist) * 0.02;

              velocity.x += dx * 0.002 * force;
              velocity.y += dy * 0.002 * force;

              velocity.z += Math.sin(Date.now() * 0.002) * 0.3;
            }
          }
          // =========================================
          // RETURN FORCE
          // =========================================

          const original = originalPositions[i];

          velocity.x += (original.x - px) * 0.003;

          velocity.y += (original.y - py) * 0.003;

          velocity.z += (original.z - pz) * 0.003;
          // =====================================================
          // FLUID MOTION
          // =====================================================

          const fluid = Math.sin(px * 0.01 + Date.now() * 0.001) * 0.6;

          const fluid2 = Math.cos(py * 0.01 + Date.now() * 0.001) * 0.6;

          velocity.x += fluid * 0.04;

          velocity.y += fluid2 * 0.04;
          // =====================================================
          // FLUID FRICTION
          // =====================================================

          velocity.x *= 0.96;

          velocity.y *= 0.96;

          velocity.z *= 0.96;
          // =========================================
          // APPLY
          // =========================================
          if (najaMode) {
            const target = najaTargets[i];

            px += (target.x - px) * 0.12;

            py += (target.y - py) * 0.12;

            pz += (target.z - pz) * 0.12;

            // ZERAR VELOCIDADE

            velocity.x = 0;

            velocity.y = 0;

            velocity.z = 0;
          } else {
            px += velocity.x;

            py += velocity.y;

            pz += velocity.z;
          }
          pos[ix] = px;
          pos[ix + 1] = py;
          pos[ix + 2] = pz;
        }

        geometry.attributes.position.needsUpdate = true;

        particles.rotation.y += 0.0008;
        // =====================================================
        // FLUID WORLD
        // =====================================================

        particles.rotation.x += Math.sin(Date.now() * 0.0002) * 0.00005;

        particles.position.y = Math.sin(Date.now() * 0.0004) * 15;

        explosionForce *= 0.92;

        renderer.render(scene, camera);
      }

      animate();

      // =====================================================
      // RESIZE
      // =====================================================

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(window.innerWidth, window.innerHeight);

        handCanvas.width = window.innerWidth;

        handCanvas.height = window.innerHeight;
      });
    </script>
  </body>
</html>
