<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>PARTÍCULAS COM AS MÃOS</title>

    <!-- MEDIAPIPE -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
      }

      canvas {
        display: block;
      }

      video {
        position: absolute;
        width: 240px;
        right: 20px;
        bottom: 20px;
        border-radius: 20px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        transform: scaleX(-1);
        z-index: 10;
      }

      #handCanvas {
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
      }

      .hud {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 20;
        color: white;
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(20px);
        border-radius: 20px;
        padding: 20px;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .hud h1 {
        font-size: 28px;
        margin-bottom: 15px;
      }

      .line {
        margin-top: 8px;
        opacity: 0.9;
      }
    </style>
  </head>

  <body>
    <video id="video" autoplay muted playsinline></video>

    <canvas id="handCanvas"></canvas>

    <script type="module">
      const explosionSound = new Audio("./sounds/explosion.mp3");

      const chargeSound = new Audio("./sounds/charge.mp3");

      const ambientSound = new Audio("./sounds/ambient.mp3");
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js";

      // =====================================================
      // VIDEO
      // =====================================================

      const video = document.getElementById("video");

      navigator.mediaDevices
        .getUserMedia({
          video: true,
        })
        .then((stream) => {
          video.srcObject = stream;
        });

      // =====================================================
      // SCENE
      // =====================================================

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x000000, 0.0007);

      // =====================================================
      // CAMERA
      // =====================================================

      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        5000,
      );

      camera.position.z = 700;

      // =====================================================
      // RENDERER
      // =====================================================

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
      });

      renderer.setSize(window.innerWidth, window.innerHeight);

      renderer.setPixelRatio(window.devicePixelRatio);

      document.body.appendChild(renderer.domElement);

      // =====================================================
      // PARTICLES
      // =====================================================

      const PARTICLE_COUNT = 25000;

      const positions = new Float32Array(PARTICLE_COUNT * 3);

      const colors = new Float32Array(PARTICLE_COUNT * 3);

      const velocities = [];

      const originalPositions = [];

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const x = (Math.random() - 0.5) * 2500;

        const y = (Math.random() - 0.5) * 2500;

        const z = (Math.random() - 0.5) * 1200;

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        originalPositions.push({
          x,
          y,
          z,
        });

        velocities.push({
          x: 0,
          y: 0,
          z: 0,
        });

        const random = Math.random();

        if (random > 0.8) {
          colors[i * 3] = 1;
          colors[i * 3 + 1] = 1;
          colors[i * 3 + 2] = 1;
        } else if (random > 0.5) {
          colors[i * 3] = 1;
          colors[i * 3 + 1] = 1;
          colors[i * 3 + 2] = 1;
        } else {
          colors[i * 3] = 1;
          colors[i * 3 + 1] = 1;
          colors[i * 3 + 2] = 1;
        }
      }

      const geometry = new THREE.BufferGeometry();

      geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(positions, 3),
      );

      geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 1.5,
        vertexColors: true,
        transparent: true,
        opacity: 1,
        blending: THREE.AdditiveBlending,
        alphaTest: 0.001,
        depthWrite: false,
      });

      const particles = new THREE.Points(geometry, material);

      scene.add(particles);

      // =====================================================
      // HAND TRACKING CANVAS
      // =====================================================

      const handCanvas = document.getElementById("handCanvas");

      const handCtx = handCanvas.getContext("2d");

      handCanvas.width = window.innerWidth;

      handCanvas.height = window.innerHeight;

      // =====================================================
      // MEDIAPIPE
      // =====================================================

      const hands = new Hands({
        locateFile: (file) => {
          return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        },
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7,
      });

      // =====================================================
      // HANDS
      // =====================================================

      const handPoints = [];
      // =====================================================
      // COLOQUE ESSE BLOCO ANTES DO hands.onResults()
      // =====================================================

      let handsJoined = false;

      let explosionForce = 0;

      // =====================================================
      // FUNÇÃO DISTÂNCIA
      // =====================================================

      function handDistance(hand1, hand2) {
        const p1 = hand1[9];

        const p2 = hand2[9];

        const dx = p1.x - p2.x;

        const dy = p1.y - p2.y;

        return Math.sqrt(dx * dx + dy * dy);
      }

      hands.onResults((results) => {
        // =====================================================
        // JUNTAR / EXPLODIR PARTÍCULAS
        // =====================================================

        if (
          results.multiHandLandmarks &&
          results.multiHandLandmarks.length === 2
        ) {
          const hand1 = results.multiHandLandmarks[0];

          const hand2 = results.multiHandLandmarks[1];

          const dist = handDistance(hand1, hand2);

          // MÃOS JUNTAS

          if (dist < 0.18) {
            handsJoined = true;
          }

          // ABRIR MÃOS = EXPLOSÃO

          if (handsJoined && dist > 0.28) {
            handsJoined = false;

            explosionForce = 1;
          }
        }
        handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);

        handPoints.length = 0;

        if (results.multiHandLandmarks) {
          for (const hand of results.multiHandLandmarks) {
            drawConnectors(handCtx, hand, HAND_CONNECTIONS, {
              color: "#00ff99",
              lineWidth: 2,
            });

            drawLandmarks(handCtx, hand, {
              color: "#ff0000",
              radius: 2,
            });

            for (const point of hand) {
              handPoints.push({
                x: (point.x - 0.5) * 2500,

                y: -(point.y - 0.5) * 2500,
              });
            }
          }
        }
      });

      // =====================================================
      // START CAMERA
      // =====================================================

      const mediapipeCamera = new Camera(video, {
        onFrame: async () => {
          await hands.send({
            image: video,
          });
        },

        width: 640,
        height: 480,
      });

      mediapipeCamera.start();

      // =====================================================
      // ANIMATION
      // =====================================================

      function animate() {
        requestAnimationFrame(animate);

        const pos = geometry.attributes.position.array;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const ix = i * 3;

          let px = pos[ix];
          let py = pos[ix + 1];
          let pz = pos[ix + 2];

          const velocity = velocities[i];
          const noise = Math.sin(i + Date.now() * 0.001) * 0.02;

          velocity.x += noise;

          velocity.y += noise;
          // =====================================================
          // JUNTAR PARTÍCULAS
          // =====================================================

          // =====================================================
          // EXPLOSÃO
          // =====================================================

          // =====================================================
          // EXPLOSÃO ORGÂNICA
          // =====================================================
          // =====================================================
          // EXPLOSÃO REALISTA
          // =====================================================

          if (explosionForce > 0) {
            // DIREÇÃO ALEATÓRIA

            const randomX = Math.random() - 0.5;

            const randomY = Math.random() - 0.5;

            const randomZ = Math.random() - 0.5;

            // NORMALIZAÇÃO

            const length = Math.sqrt(
              randomX * randomX + randomY * randomY + randomZ * randomZ,
            );

            const dirX = randomX / length;

            const dirY = randomY / length;

            const dirZ = randomZ / length;

            // FORÇA

            const power = explosionForce * 12;

            // EXPLOSÃO

            velocity.x += dirX * power;

            velocity.y += dirY * power;

            velocity.z += dirZ * power;
          }

          // =========================================
          // HAND FORCE
          // =========================================

          for (const hand of handPoints) {
            const dx = px - hand.x;

            const dy = py - hand.y;

            const dist = Math.sqrt(dx * dx + dy * dy);

            // ÁREA MENOR DE IMPACTO

            if (dist < 90) {
              // FORÇA MAIS SUAVE

              const force = (90 - dist) * 0.04;

              const angle = Math.atan2(dy, dx);

              velocity.x += Math.cos(angle) * force;

              velocity.y += Math.sin(angle) * force;
            }
          }
          // =========================================
          // RETURN FORCE
          // =========================================

          const original = originalPositions[i];

          velocity.x += (original.x - px) * 0.003;

          velocity.y += (original.y - py) * 0.003;

          velocity.z += (original.z - pz) * 0.003;
          // =====================================================
          // FLUID MOTION
          // =====================================================

          const fluid = Math.sin(px * 0.01 + Date.now() * 0.001) * 0.6;

          const fluid2 = Math.cos(py * 0.01 + Date.now() * 0.001) * 0.6;

          velocity.x += fluid * 0.04;

          velocity.y += fluid2 * 0.04;
          // =====================================================
          // FLUID FRICTION
          // =====================================================

          velocity.x *= 0.96;

          velocity.y *= 0.96;

          velocity.z *= 0.96;
          // =========================================
          // APPLY
          // =========================================

          px += velocity.x;
          py += velocity.y;
          pz += velocity.z;

          pos[ix] = px;
          pos[ix + 1] = py;
          pos[ix + 2] = pz;
        }

        geometry.attributes.position.needsUpdate = true;

        particles.rotation.y += 0.0008;
        // =====================================================
        // FLUID WORLD
        // =====================================================

        particles.rotation.x += Math.sin(Date.now() * 0.0002) * 0.00005;

        particles.position.y = Math.sin(Date.now() * 0.0004) * 15;

        explosionForce *= 0.92;

        renderer.render(scene, camera);
      }

      animate();

      // =====================================================
      // RESIZE
      // =====================================================

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(window.innerWidth, window.innerHeight);

        handCanvas.width = window.innerWidth;

        handCanvas.height = window.innerHeight;
      });
    </script>
  </body>
</html>
